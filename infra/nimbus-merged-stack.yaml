AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Nimbus RM for the AWS Academy Learner Lab: CloudFront HTTPS distribution in
  front of an Application Load Balancer and an Auto Scaling group of EC2 Flask
  servers across two Availability Zones, with a private single-AZ MySQL RDS
  database. The stack only completes once a server has bootstrapped, and
  changing GitCommit replaces the servers one at a time (rolling update).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Application" }
        Parameters: [RepositoryUrl, GitCommit, AppSecretKey, OriginVerifyToken]
      - Label: { default: "Database" }
        Parameters: [DBUsername, DBPassword, DBInstanceClass]
      - Label: { default: "Web servers and scaling" }
        Parameters: [InstanceType, CpuTargetPercent, RequestsPerServerTarget, KeyName, SSHAllowedCidr, LatestAmiId]

Parameters:
  RepositoryUrl:
    Type: String
    Description: Public HTTPS URL of the Nimbus RM Git repository.
  GitCommit:
    Type: String
    AllowedPattern: "[0-9a-f]{7,40}"
    ConstraintDescription: A commit hash (7–40 lower-case hex characters), e.g. from "git rev-parse HEAD".
    Description: >
      Exact commit to deploy. Changing it on "Update stack" replaces the servers
      one at a time with that commit; the database is kept.
  AppSecretKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Random secret used to sign Flask sessions (python3 -c "import secrets; print(secrets.token_hex(32))"). Every server uses the same value, so a login works on any server.
  OriginVerifyToken:
    Type: String
    NoEcho: true
    MinLength: 32
    MaxLength: 64
    AllowedPattern: "[A-Fa-f0-9]+"
    Description: Random hex value used to reject requests that bypass CloudFront (use a different value from AppSecretKey).
  DBUsername:
    Type: String
    Default: admin
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9]{2,15}"
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    AllowedPattern: "[a-zA-Z0-9!#%^*_+=-]*"
    Description: RDS password; use letters, digits and !#%^*_+=- only.
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small, db.t3.medium]
  InstanceType:
    Type: String
    Default: t3.micro
    # The Sandbox lets Auto Scaling groups use t2/t3 nano to small only.
    AllowedValues: [t2.nano, t2.micro, t2.small, t3.nano, t3.micro, t3.small]
  CpuTargetPercent:
    Type: Number
    Default: 60
    MinValue: 10
    MaxValue: 90
    Description: Target average CPU across the servers; the group adds servers above it and removes them below it.
  RequestsPerServerTarget:
    Type: Number
    Default: 300
    MinValue: 10
    Description: Target requests per server per minute through the load balancer (second scaling policy).
  KeyName:
    Type: String
    Default: ""
    Description: Optional EC2 key pair for SSH (Learner Lab - "vockey"). Leave empty to use Session Manager only.
  SSHAllowedCidr:
    Type: String
    Default: 127.0.0.1/32
    Description: Set to your public IP/32 only if SSH is needed; the default effectively disables SSH.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI.

Conditions:
  HasKey: !Not [!Equals [!Ref KeyName, ""]]

Resources:
  # ------------------------------------------------------------------ VPC
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: nimbus-vpc }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: nimbus-igw }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Two public subnets in different Availability Zones: the load balancer needs
  # two AZs, and the Auto Scaling group spreads servers across them.
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: nimbus-public-1 }]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: nimbus-public-2 }]

  # RDS needs a subnet group that spans two AZs, hence two private subnets.
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: nimbus-private-1 }]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: nimbus-private-2 }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: nimbus-public-rt }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # No internet route: the database is reachable only from inside the VPC.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: nimbus-private-rt }]

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ------------------------------------------------------- Security groups
  # Internet -> CloudFront -> load balancer (port 80) -> web servers (port 80) -> RDS (3306).
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Nimbus load balancer; its listener forwards only requests carrying the CloudFront origin token.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from CloudFront; requests without the origin token get 403.
      Tags: [{ Key: Name, Value: nimbus-alb-sg }]

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Nimbus web servers; HTTP from the load balancer only, optional SSH.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: HTTP from the load balancer only.
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHAllowedCidr
          Description: Optional SSH, restricted to the configured admin CIDR.
      Tags: [{ Key: Name, Value: nimbus-web-sg }]

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MySQL access from the Nimbus web servers only.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref WebSecurityGroup
          Description: MySQL from web tier only
      Tags: [{ Key: Name, Value: nimbus-db-sg }]

  # ------------------------------------------------------------------ RDS
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for Nimbus MySQL.
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  # Deleting the stack deletes the database and every saved discussion. To deploy
  # new code, update GitCommit instead (rolling update; the database is kept).
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: mysql  # no version pinned: RDS uses its current default MySQL version
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: "20"
      StorageType: gp2
      DBName: nimbus
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DBSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      StorageEncrypted: true
      Tags: [{ Key: Name, Value: nimbus-db }]

  SnapshotArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: TransitionArchivedSnapshotsToGlacier
            Status: Enabled
            Prefix: snapshots/
            Transitions:
              - TransitionInDays: 30
                StorageClass: GLACIER

  # -------------------------------------------------------- Load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: GatewayAttachment
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnet, !Ref PublicSubnet2]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "60"
      Tags: [{ Key: Name, Value: nimbus-alb }]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Protocol: HTTP
      Port: 80
      TargetType: instance
      # Checks the app and its database connection; Nginx lets only this path through without the token.
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags: [{ Key: Name, Value: nimbus-web-tg }]

  # Requests without CloudFront's secret header are refused here, before any server.
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: text/plain
            MessageBody: Use the Nimbus CloudFront URL.

  ForwardFromCloudFront:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values: [!Ref OriginVerifyToken]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------------------------------------------- Web servers (auto scaling)
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        KeyName: !If [HasKey, !Ref KeyName, !Ref "AWS::NoValue"]
        # Used by Session Manager and the S3 snapshot archive (IAM is read-only in the Sandbox).
        IamInstanceProfile: { Name: LabInstanceProfile }
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true  # outbound internet for packages and Yahoo Finance (no NAT gateway)
            Groups: [!Ref WebSecurityGroup]
            DeleteOnTermination: true
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 8
              VolumeType: gp2
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags: [{ Key: Name, Value: nimbus-web }]
          - ResourceType: volume
            Tags: [{ Key: Name, Value: nimbus-web }]
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            exec > /var/log/nimbus-bootstrap.log 2>&1
            chmod 600 /var/log/nimbus-bootstrap.log
            dnf install -y git aws-cfn-bootstrap
            # Tell CloudFormation straight away if any step fails, instead of waiting 25 minutes.
            # (Servers added later by scaling also signal; CloudFormation ignores those.)
            trap '/opt/aws/bin/cfn-signal -e 1 --stack ${AWS::StackName} --resource WebServerGroup --region ${AWS::Region} || true' ERR

            # Deploy the exact commit chosen in the GitCommit parameter.
            git clone "${RepositoryUrl}" /opt/nimbus
            git -C /opt/nimbus checkout --detach "${GitCommit}"

            IMDS_TOKEN=$(curl -sS -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
            INSTANCE_ID=$(curl -sS -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/instance-id)

            umask 077
            set +x  # keep secrets out of the bootstrap log
            cat > /opt/nimbus/.env <<ENVEOF
            SECRET_KEY=${AppSecretKey}
            DB_HOST=${Database.Endpoint.Address}
            DB_PORT=${Database.Endpoint.Port}
            DB_NAME=nimbus
            DB_USER=${DBUsername}
            DB_PASSWORD=${DBPassword}
            SNAPSHOT_ARCHIVE_BUCKET=${SnapshotArchiveBucket}
            AWS_DEFAULT_REGION=${AWS::Region}
            MARKET_DATA_PROVIDER=yahoo
            DEMO_FALLBACK=false
            CACHE_TTL=900
            SESSION_COOKIE_SECURE=true
            NIMBUS_COMMIT=${GitCommit}
            NIMBUS_INSTANCE_ID=$INSTANCE_ID
            ENVEOF
            sed -i 's/^[ \t]*//' /opt/nimbus/.env
            sed -i "s/__ORIGIN_VERIFY_TOKEN__/${OriginVerifyToken}/g" /opt/nimbus/deploy/nginx-cloudfront.conf
            chmod 600 /opt/nimbus/deploy/nginx-cloudfront.conf
            set -x
            umask 022

            bash /opt/nimbus/deploy/setup_ec2.sh
            /opt/aws/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource WebServerGroup --region ${AWS::Region} || true

  WebServerGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - PublicDefaultRoute
      - PublicSubnetRouteTableAssociation
      - PublicSubnet2RouteTableAssociation
    CreationPolicy:
      ResourceSignal: { Count: 1, Timeout: PT25M }
    # Changing GitCommit (or anything in the launch template) replaces the servers
    # one at a time: a new server must signal success before an old one is removed.
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT25M
        WaitOnResourceSignals: true
        SuspendProcesses: [HealthCheck, ReplaceUnhealthy, AZRebalance, AlarmNotification, ScheduledActions]
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: "1"
      MaxSize: "3"
      VPCZoneIdentifier: [!Ref PublicSubnet, !Ref PublicSubnet2]
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 900  # a new server needs several minutes to install packages
      DefaultInstanceWarmup: 300
      Tags:
        - Key: Name
          Value: nimbus-web
          PropagateAtLaunch: true

  # Target tracking: the group adds servers when a metric is above its target
  # and removes them when both metrics are comfortably below (between 1 and 3).
  CpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref WebServerGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref CpuTargetPercent

  RequestScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    DependsOn: ForwardFromCloudFront  # the target group must be attached to the load balancer first
    Properties:
      AutoScalingGroupName: !Ref WebServerGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Join
            - "/"
            - [!GetAtt LoadBalancer.LoadBalancerFullName, !GetAtt TargetGroup.TargetGroupFullName]
        TargetValue: !Ref RequestsPerServerTarget

  # ----------------------------------------------------------- CloudFront
  CloudFrontOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-origin-requests"
        Comment: Forward session cookies, form/query parameters, and viewer protocol.
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - CloudFront-Forwarded-Proto
        QueryStringsConfig:
          QueryStringBehavior: all

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: WebServerGroup  # create only after a server is up
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Nimbus RM application distribution.
        PriceClass: PriceClass_100
        HttpVersion: http2
        IPV6Enabled: true
        Origins:
          - Id: NimbusLoadBalancerOrigin
            DomainName: !GetAtt LoadBalancer.DNSName
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginVerifyToken
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: NimbusLoadBalancerOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
          OriginRequestPolicyId: !Ref CloudFrontOriginRequestPolicy
          Compress: true
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Restrictions:
          GeoRestriction:
            RestrictionType: none

Outputs:
  ApplicationURL:
    Description: HTTPS URL for the Nimbus RM app through CloudFront.
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
  LoadBalancerDNSName:
    Description: Load balancer address (returns 403 unless the request comes through CloudFront).
    Value: !GetAtt LoadBalancer.DNSName
  AutoScalingGroupName:
    Description: Open this in EC2 > Auto Scaling groups to see scaling activity.
    Value: !Ref WebServerGroup
  DeployedCommit:
    Description: Commit the servers run (also shown in the app's footer).
    Value: !Ref GitCommit
  DatabaseEndpoint:
    Description: Private RDS endpoint, reachable from the web servers only.
    Value: !GetAtt Database.Endpoint.Address
  SnapshotArchiveBucketName:
    Description: Private S3 bucket; archived snapshots transition to Glacier after 30 days.
    Value: !Ref SnapshotArchiveBucket
  VpcId:
    Value: !Ref VPC
